name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/CampusEats.Api/CampusEats.Api.csproj

    - name: Build
      run: dotnet build src/CampusEats.Api/CampusEats.Api.csproj --no-restore --configuration Release

    # Uncomment the following step if unit tests are added in the future
    # - name: Test
    #   run: dotnet test src/CampusEats.Api/CampusEats.Api.csproj --no-build --verbosity normal --configuration Release
